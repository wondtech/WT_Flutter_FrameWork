# WT Flutter Framework — analysis options.
# Base recommended Flutter lints plus a few quality-focused extras.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Public API of a package should be documented.
    public_member_api_docs: ignore # enforced by review, not build-breaking
  exclude:
    - example/**  # the example has its own analysis_options
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - unnecessary_parenthesis
    - use_super_parameters
